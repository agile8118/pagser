<!DOCTYPE html>
<html lang="en">
  <include src="./partials/head.html" />
  <body>
    <include src="./partials/header.html" />

    <div class="pb-banner">
      <div class="row">
        <h1>{{ name }}</h1>
        <h2>{{ headline }}</h2>
      </div>
    </div>

    <div class="row margin-bottom-6">
      <div class="col-xxs-1-of-1 col-lg-1-of-3">
        <div class="pb-left-items">
          <img src="{{ photoUrl }}" alt="user image" id="user-image" onerror="this.src='{{ photoFallback }}'" />
          <div class="pb-left-items__link">
            {{{ linksHtml }}}
          </div>
        </div>
      </div>
      <div class="col-lg-2-of-3">
        <div class="pb-right-items">
          <p>{{ biography }}</p>
        </div>
      </div>
    </div>

    <div class="react-container" name="public-profile"></div>

    <div
      class="cupertino-modal-container cupertino-modal-container--light display-none"
      id="loading-modal"
    >
      <div class="cupertino-modal cupertino-modal--loading">
        <div class="cupertino-modal__content">
          <h3 id="loading-modal-message"></h3>
        </div>
        <div class="center-content">
          <div class="lds-css ng-scope">
            <div class="lds-spinner">
              <div></div>
              <div></div>
              <div></div>
              <div></div>
              <div></div>
              <div></div>
              <div></div>
              <div></div>
              <div></div>
              <div></div>
              <div></div>
              <div></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <include src="./partials/footer.html" />
  </body>
</html>
